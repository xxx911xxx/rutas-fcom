<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coche FCom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .asiento { transition: all 0.2s; }
        .asiento:active { transform: scale(0.95); }
        #modalCartera { transition: opacity 0.3s ease; }
        #modalCartera > div { transition: transform 0.3s ease; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 font-sans text-slate-800">

    <!-- PANTALLA 1: LOGIN -->
    <div id="pantallaLogin" class="max-w-md mx-auto bg-white rounded-3xl shadow-xl p-8 mt-10">
        <h1 class="text-3xl font-bold text-center mb-8">🚗 Login FCom</h1>
        <select id="selectorUsuario" class="w-full border-2 border-slate-200 rounded-xl p-4 text-lg mb-4 outline-none font-medium">
            <option value="">Cargando usuarios...</option>
        </select>
        <input type="password" inputmode="numeric" pattern="[0-9]*" id="pinSecreto" maxlength="4" placeholder="Tu PIN (4 cifras)" class="w-full border-2 border-slate-200 rounded-xl p-4 text-center text-2xl tracking-[1em] mb-6 outline-none font-bold">
        <button onclick="iniciarSesion()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg text-lg transition-all">Entrar</button>
        <p id="errorLogin" class="text-rose-500 text-center font-bold mt-4 hidden">PIN incorrecto.</p>
    </div>

    <!-- PANTALLA 2: MODO SÚPER JEFE (ADMIN) -->
    <div id="pantallaAdmin" class="max-w-md mx-auto bg-slate-50 rounded-3xl shadow-xl p-6 mt-10 hidden border-4 border-blue-200">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black text-blue-700">👑 Súper Jefe</h1>
            <button onclick="cerrarSesion()" class="text-slate-500 underline font-bold">Salir</button>
        </div>
        
        <div class="mb-6">
            <h2 class="font-black text-lg mb-3 flex items-center gap-2 text-slate-700">💰 Cuentas y Bizums</h2>
            <div id="listaSaldosAdmin" class="grid grid-cols-2 gap-2"></div>
        </div>

        <hr class="border-slate-300 mb-6">

        <h2 class="font-black text-lg mb-3 flex items-center gap-2 text-slate-700">📅 Gestión de Viajes</h2>
        
        <div class="mb-6 p-4 bg-blue-100 rounded-2xl">
            <h3 class="font-bold text-blue-900 mb-2 text-sm">➕ Añadir nuevo día lectivo:</h3>
            <div class="flex gap-2">
                <input type="date" id="nuevoDiaInput" class="w-full border-2 border-white rounded-xl p-2 outline-none font-medium bg-white">
                <button onclick="crearDiaManual()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 rounded-xl shadow active:scale-95 transition-transform">Crear</button>
            </div>
        </div>

        <div id="listaViajesAdmin" class="space-y-4"></div>
    </div>

    <!-- PANTALLA 3: MODO AMIGOS (RESERVAS Y COCHE) -->
    <div id="pantallaAmigos" class="max-w-md mx-auto bg-white rounded-3xl shadow-xl p-6 mt-10 hidden relative">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-emerald-600">🚗 Elige tu sitio</h1>
            <div class="flex items-center gap-3">
                <button onclick="abrirCartera()" class="bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-lg font-bold text-sm shadow-sm border border-emerald-200 hover:bg-emerald-100 transition-all flex items-center gap-1">💳 Cartera</button>
                <button onclick="cerrarSesion()" class="text-slate-500 underline text-sm font-bold">Salir</button>
            </div>
        </div>
        
        <div class="flex justify-between items-end mb-2">
            <label class="font-bold text-slate-700">1. Selecciona los días:</label>
            <span id="contadorDias" class="text-xs font-bold text-blue-600 bg-blue-100 px-2 py-1 rounded-lg hidden">0 seleccionados</span>
        </div>
        
        <div id="calendarioViajes" class="grid grid-cols-3 gap-3 mb-6"></div>

        <div id="mapaCoche" class="hidden bg-slate-50 rounded-3xl p-6 border-4 border-slate-200 relative">
            <div class="text-center font-bold text-slate-400 mb-4">PARTE DELANTERA</div>
            <div class="grid grid-cols-2 gap-6 mb-6">
                <div class="bg-slate-800 text-white p-4 rounded-2xl text-center font-bold flex flex-col justify-center opacity-80 cursor-not-allowed h-24">
                    <span>Volante 🚘</span><span class="text-xs font-normal">Yisu (Tú)</span>
                </div>
                <button id="asiento_copiloto" onclick="reservarSitio('copiloto')" class="asiento bg-emerald-100 border-2 border-emerald-500 text-emerald-700 p-4 rounded-2xl text-center font-bold h-24 shadow-sm">
                    <span>Copiloto</span><span class="block text-xs font-normal mt-1 libre-txt">Libre</span>
                </button>
            </div>
            <div class="grid grid-cols-3 gap-2">
                <button id="asiento_atras_izq" onclick="reservarSitio('atras_izq')" class="asiento bg-emerald-100 border-2 border-emerald-500 text-emerald-700 p-3 rounded-2xl text-center font-bold text-sm h-20 flex flex-col justify-center items-center shadow-sm">
                    <span>Izq.</span><span class="block text-xs font-normal libre-txt">Libre</span>
                </button>
                <button id="asiento_atras_cen" onclick="reservarSitio('atras_cen')" class="asiento bg-emerald-100 border-2 border-emerald-500 text-emerald-700 p-3 rounded-2xl text-center font-bold text-sm h-20 flex flex-col justify-center items-center shadow-sm">
                    <span>Medio</span><span class="block text-xs font-normal libre-txt">Libre</span>
                </button>
                <button id="asiento_atras_der" onclick="reservarSitio('atras_der')" class="asiento bg-emerald-100 border-2 border-emerald-500 text-emerald-700 p-3 rounded-2xl text-center font-bold text-sm h-20 flex flex-col justify-center items-center shadow-sm">
                    <span>Der.</span><span class="block text-xs font-normal libre-txt">Libre</span>
                </button>
            </div>
            
            <!-- Zona de Cancelación de Reserva (Aparece dinámicamente) -->
            <div id="zonaCancelar" class="mt-6 hidden border-t-2 border-slate-200 pt-6"></div>
        </div>
    </div>

    <!-- MODAL DE LA CARTERA VIRTUAL -->
    <div id="modalCartera" class="fixed inset-0 bg-slate-900/60 hidden flex justify-center items-end sm:items-center z-50 p-4 opacity-0">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden transform translate-y-full sm:translate-y-0">
            <div class="bg-slate-800 p-5 text-white flex justify-between items-center">
                <h2 class="font-black text-xl tracking-wide">💳 Mi Cartera</h2>
                <button onclick="cerrarCartera()" class="text-slate-300 hover:text-white font-black text-3xl leading-none">&times;</button>
            </div>
            <div class="p-6">
                <div class="text-center mb-6">
                    <p class="text-slate-500 text-sm font-bold uppercase tracking-widest">Saldo Disponible</p>
                    <p id="carteraSaldoTotal" class="text-5xl font-black text-slate-800 mt-2 tracking-tighter">0€</p>
                </div>
                <div class="text-xs font-black text-slate-400 uppercase tracking-widest mb-3 border-b-2 border-slate-100 pb-2">Historial de movimientos</div>
                <div id="listaMovimientos" class="space-y-3 max-h-60 overflow-y-auto pr-2"></div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://wangfcwblatimxldtvva.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhbmdmY3dibGF0aW14bGR0dnZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMzc2MjUsImV4cCI6MjEwMTcxMzYyNX0.GLc2K37j8YURsJHf5mHdhP7dbPKvfIujNwiztafMg84"; 
        
        const headers = {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
        };

        let usuarioActual = null;
        let usuariosGlobal = [];
        let viajesSeleccionados = [];

        // ==========================================
        // SISTEMA DE TOASTS
        // ==========================================
        function mostrarToast(mensaje, tipo = 'exito') {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                container.className = 'fixed bottom-8 left-0 right-0 flex flex-col items-center gap-3 z-50 pointer-events-none px-4';
                document.body.appendChild(container);
            }
            const toast = document.createElement('div');
            let colorBg = tipo === 'error' ? 'bg-rose-600' : (tipo === 'aviso' ? 'bg-amber-500' : 'bg-slate-800');
            toast.className = `${colorBg} text-white px-5 py-3 rounded-2xl shadow-2xl font-bold text-sm transform transition-all duration-300 translate-y-10 opacity-0 flex items-center text-center max-w-sm`;
            toast.innerText = mensaje;
            container.appendChild(toast);
            
            setTimeout(() => toast.classList.remove('translate-y-10', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500); 
        }

        function hoyString() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        async function init() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/usuarios?select=*`, { headers, cache: 'no-store' });
                if (!res.ok) throw new Error("Fallo de red");
                usuariosGlobal = await res.json();
                const sel = document.getElementById('selectorUsuario');
                sel.innerHTML = '<option value="">¿Quién eres?</option>';
                usuariosGlobal.forEach(u => sel.innerHTML += `<option value="${u.id}">${u.nombre}</option>`);
            } catch (e) { mostrarToast("❌ Error conectando con la base de datos.", "error"); }
        }

        async function iniciarSesion() {
            const errorMsg = document.getElementById('errorLogin');
            const btn = document.querySelector('#pantallaLogin button');
            errorMsg.classList.add('hidden');

            const id = document.getElementById('selectorUsuario').value;
            const pinInput = document.getElementById('pinSecreto').value;
            if(!id || !pinInput) { errorMsg.innerText = "⚠️ Faltan datos."; errorMsg.classList.remove('hidden'); return; }

            btn.innerText = "Comprobando..."; btn.disabled = true;

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/usuarios?id=eq.${id}&select=*`, { headers, cache: 'no-store' });
                const data = await res.json();

                if (!data || data.length === 0) {
                    errorMsg.innerText = "❌ Usuario no encontrado."; errorMsg.classList.remove('hidden');
                    btn.innerText = "Entrar"; btn.disabled = false; return;
                }

                const usuarioDDBB = data[0];
                const pinSoloNumerosDB = String(usuarioDDBB.pin || "").replace(/\D/g, '');
                const pinSoloNumerosWeb = String(pinInput).replace(/\D/g, '');

                if (pinSoloNumerosDB !== pinSoloNumerosWeb) {
                    errorMsg.innerText = `❌ PIN incorrecto. Inténtalo de nuevo.`; errorMsg.classList.remove('hidden');
                    btn.innerText = "Entrar"; btn.disabled = false; return;
                }
                
                usuarioActual = usuarioDDBB;
                document.getElementById('pantallaLogin').classList.add('hidden');
                document.getElementById('pinSecreto').value = ''; 
                
                if (usuarioActual.es_admin) {
                    document.getElementById('pantallaAdmin').classList.remove('hidden');
                    cargarPanelJefe();
                    mostrarToast("👑 Bienvenido, Súper Jefe", "exito");
                } else {
                    document.getElementById('pantallaAmigos').classList.remove('hidden');
                    cargarViajesAmigos();
                    mostrarToast(`👋 Bienvenido, ${usuarioActual.nombre.split(" ")[0]}`, "exito");
                }
            } catch (error) {
                errorMsg.innerText = "📡 Error de red."; errorMsg.classList.remove('hidden');
                btn.innerText = "Entrar"; btn.disabled = false;
            }
        }

        function cerrarSesion() { location.reload(); }

        // ==========================================
        // LA CARTERA VIRTUAL
        // ==========================================
        async function abrirCartera() {
            const modal = document.getElementById('modalCartera');
            const contenido = modal.querySelector('div');
            const lista = document.getElementById('listaMovimientos');
            
            const resSaldo = await fetch(`${SUPABASE_URL}/rest/v1/usuarios?id=eq.${usuarioActual.id}&select=saldo`, { headers, cache: 'no-store' });
            const dataSaldo = await resSaldo.json();
            usuarioActual.saldo = dataSaldo[0].saldo;
            document.getElementById('carteraSaldoTotal').innerText = `${usuarioActual.saldo}€`;

            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); contenido.classList.remove('translate-y-full'); }, 10);
            lista.innerHTML = '<p class="text-center text-slate-400 text-sm mt-4 animate-pulse">Consultando el banco...</p>';
            
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/movimientos_saldo?usuario_id=eq.${usuarioActual.id}`, { headers, cache: 'no-store' });
                if(!res.ok) { lista.innerHTML = '<p class="text-center text-rose-500 text-sm mt-4 font-bold">⚠️ Error al conectar con el historial.</p>'; return; }
                let movs = await res.json();
                movs.reverse(); 
                
                lista.innerHTML = '';
                if(movs.length === 0) { lista.innerHTML = '<p class="text-center text-slate-400 text-sm mt-4 italic">Todavía no has gastado ni recargado nada.</p>'; return; }
                movs.forEach(m => {
                    const esPositivo = m.cantidad > 0;
                    const colorTexto = esPositivo ? 'text-emerald-600' : 'text-rose-500';
                    const colorFondo = esPositivo ? 'bg-emerald-50' : 'bg-rose-50';
                    const icono = esPositivo ? '🟢' : '🔴';
                    const signo = esPositivo ? '+' : '';
                    
                    lista.innerHTML += `
                        <div class="flex justify-between items-center p-4 rounded-2xl ${colorFondo} border border-slate-100/50 shadow-sm">
                            <div class="flex items-center gap-3 truncate pr-2">
                                <span class="text-lg">${icono}</span>
                                <span class="font-bold text-sm text-slate-700 truncate">${m.tipo}</span>
                            </div>
                            <span class="font-black text-lg ${colorTexto} whitespace-nowrap">${signo}${m.cantidad}€</span>
                        </div>`;
                });
            } catch(e) { lista.innerHTML = '<p class="text-center text-rose-500 text-sm mt-4 font-bold">Error al cargar el historial.</p>'; }
        }

        function cerrarCartera() {
            const modal = document.getElementById('modalCartera');
            const contenido = modal.querySelector('div');
            modal.classList.add('opacity-0');
            contenido.classList.add('translate-y-full');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        // ==========================================
        // FUNCIONES SÚPER JEFE (ADMIN)
        // ==========================================
        async function añadirSaldo(userId, name) {
            const extra = prompt(`¿Cuánto dinero le quieres recargar a ${name}?\n(Escribe solo el número, ej: 5)`);
            if(!extra || isNaN(extra) || extra <= 0) return;
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/usuarios?id=eq.${userId}&select=saldo`, { headers, cache: 'no-store' });
                const data = await res.json();
                const nuevoSaldo = (data[0].saldo || 0) + parseFloat(extra);
                await fetch(`${SUPABASE_URL}/rest/v1/usuarios?id=eq.${userId}`, { method: 'PATCH', headers, body: JSON.stringify({ saldo: nuevoSaldo }) });
                await fetch(`${SUPABASE_URL}/rest/v1/movimientos_saldo`, { method: 'POST', headers, body: JSON.stringify({ usuario_id: userId, cantidad: parseFloat(extra), tipo: 'Recarga de Yisu' }) });
                mostrarToast(`💸 Recarga completada. ${name} tiene ${nuevoSaldo}€.`, "exito");
                cargarPanelJefe(); 
            } catch(e) { mostrarToast("❌ Error al recargar saldo.", "error"); }
        }

        async function eliminarReserva(resId, userId, viajeId) {
            if(!confirm("⚠️ ¿Quitar a este pasajero?\nSe liberará la plaza y se le devolverá 1€.")) return;
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/reservas?id=eq.${resId}`, { method: 'DELETE', headers });
                const resU = await fetch(`${SUPABASE_URL}/rest/v1/usuarios?id=eq.${userId}&select=saldo`, { headers, cache: 'no-store' });
                const dataU = await resU.json();
                await fetch(`${SUPABASE_URL}/rest/v1/usuarios?id=eq.${userId}`, { method: 'PATCH', headers, body: JSON.stringify({ saldo: dataU[0].saldo + 1 }) });
                const resV = await fetch(`${SUPABASE_URL}/rest/v1/viajes?id=eq.${viajeId}&select=plazas_disponibles`, { headers, cache: 'no-store' });
                const dataV = await resV.json();
                await fetch(`${SUPABASE_URL}/rest/v1/viajes?id=eq.${viajeId}`, { method: 'PATCH', headers, body: JSON.stringify({ plazas_disponibles: dataV[0].plazas_disponibles + 1 }) });
                await fetch(`${SUPABASE_URL}/rest/v1/movimientos_saldo`, { method: 'POST', headers, body: JSON.stringify({ usuario_id: userId, cantidad: 1, tipo: 'Reembolso (Expulsado por Yisu)' }) });
                mostrarToast("🗑️ Pasajero eliminado y reembolsado.", "exito");
                cargarPanelJefe();
            } catch(e) { mostrarToast("❌ Error al eliminar pasajero.", "error"); }
        }

        async function moverReserva(resId, viajeId, asientoActual) {
            try {
                const asientosPosibles = ['copiloto', 'atras_izq', 'atras_cen', 'atras_der'];
                const res = await fetch(`${SUPABASE_URL}/rest/v1/reservas?viaje_id=eq.${viajeId}&select=asiento`, { headers, cache: 'no-store' });
                const reservas = await res.json();
                const ocupados = reservas.map(r => r.asiento);
                const libres = asientosPosibles.filter(a => !ocupados.includes(a));
                if(libres.length === 0) { mostrarToast("❌ El coche está lleno.", "error"); return; }
                const nuevoAsiento = prompt(`El usuario está en: ${asientoActual}\nLos libres son: ${libres.join(", ")}\nEscribe el nuevo asiento:`).toLowerCase().trim();
                if(!nuevoAsiento) return; 
                if(!libres.includes(nuevoAsiento)) { mostrarToast("❌ Nombre incorrecto.", "error"); return; }
                await fetch(`${SUPABASE_URL}/rest/v1/reservas?id=eq.${resId}`, { method: 'PATCH', headers, body: JSON.stringify({ asiento: nuevoAsiento }) });
                mostrarToast("🔄 Pasajero movido de sitio.", "exito");
                cargarPanelJefe();
            } catch(e) { mostrarToast("❌ Error al mover asiento.", "error"); }
        }

        async function cargarPanelJefe() {
            const [resViajes, resReservas, resUsuarios] = await Promise.all([
                fetch(`${SUPABASE_URL}/rest/v1/viajes?fecha=gte.${hoyString()}&order=fecha.asc`, { headers, cache: 'no-store' }),
                fetch(`${SUPABASE_URL}/rest/v1/reservas`, { headers, cache: 'no-store' }),
                fetch(`${SUPABASE_URL}/rest/v1/usuarios?order=nombre.asc`, { headers, cache: 'no-store' })
            ]);
            const viajes = await resViajes.json();
            const todasReservas = await resReservas.json();
            usuariosGlobal = await resUsuarios.json();

            const listaSaldos = document.getElementById('listaSaldosAdmin');
            listaSaldos.innerHTML = '';
            usuariosGlobal.forEach(u => {
                if(u.id === usuarioActual.id) return; 
                let colorSaldo = u.saldo <= 0 ? 'text-rose-500' : (u.saldo === 1 ? 'text-orange-500' : 'text-slate-500');
                listaSaldos.innerHTML += `
                    <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                        <div class="truncate mr-2"><p class="font-bold text-sm truncate">${u.nombre.split(" ")[0]}</p><p class="text-xs font-black ${colorSaldo}">${u.saldo}€</p></div>
                        <button onclick="añadirSaldo('${u.id}', '${u.nombre}')" class="bg-blue-100 text-blue-700 px-3 py-2 rounded-lg font-bold text-xs hover:bg-blue-200 active:scale-95 transition-all">+ €</button>
                    </div>`;
            });

            const listaViajes = document.getElementById('listaViajesAdmin');
            listaViajes.innerHTML = '';
            viajes.forEach(v => {
                const fechaLimpia = new Date(v.fecha.split('T')[0] + 'T12:00:00').toLocaleDateString('es-ES', {weekday: 'long', day:'numeric', month:'short'});
                const esAbierto = v.estado === 'abierto';
                const colorBtn = esAbierto ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700';
                const resViaje = todasReservas.filter(r => r.viaje_id === v.id);
                let htmlAsientos = '';
                if(resViaje.length === 0) { htmlAsientos = '<p class="text-xs text-slate-400 italic bg-slate-50 p-2 rounded-lg">Coche vacío</p>'; } 
                else {
                    htmlAsientos = '<div class="space-y-2 mt-2">';
                    resViaje.forEach(r => {
                        const usr = usuariosGlobal.find(u => u.id === r.usuario_id);
                        const nombreUsr = usr ? usr.nombre.split(" ")[0] : 'Desconocido';
                        htmlAsientos += `
                            <div class="flex justify-between items-center bg-slate-50 p-2 rounded-lg border border-slate-100 text-sm">
                                <span class="font-bold text-slate-600 truncate w-32">💺 ${r.asiento.replace('atras_','')} <span class="font-normal">(${nombreUsr})</span></span>
                                <div class="flex gap-2">
                                    <button onclick="moverReserva('${r.id}', '${v.id}', '${r.asiento}')" class="text-blue-500 bg-blue-50 px-2 py-1 rounded font-bold hover:bg-blue-100 text-xs">Mover</button>
                                    <button onclick="eliminarReserva('${r.id}', '${r.usuario_id}', '${v.id}')" class="text-rose-500 bg-rose-50 px-2 py-1 rounded font-bold hover:bg-rose-100 text-xs">Echar</button>
                                </div>
                            </div>`;
                    });
                    htmlAsientos += '</div>';
                }
                listaViajes.innerHTML += `
                    <div class="p-4 border-2 border-slate-200 rounded-2xl shadow-sm bg-white">
                        <div class="flex justify-between items-center border-b border-slate-100 pb-3 mb-3">
                            <div><p class="font-black capitalize text-lg text-slate-700">${fechaLimpia}</p><p class="text-xs font-bold text-slate-400 mt-1">Plazas libres: ${v.plazas_disponibles} | ${v.estado.toUpperCase()}</p></div>
                            <button onclick="cambiarEstadoViaje('${v.id}', '${esAbierto ? 'cerrado' : 'abierto'}')" class="${colorBtn} px-3 py-2 rounded-lg font-bold text-xs">${esAbierto ? 'Cerrar Viaje' : 'Abrir Viaje'}</button>
                        </div>
                        <div class="text-xs font-black text-slate-400 uppercase tracking-wider mb-2">Pasajeros:</div>
                        ${htmlAsientos}
                    </div>`;
            });
        }

        async function crearDiaManual() {
            const nuevaFecha = document.getElementById('nuevoDiaInput').value;
            if(nuevaFecha) {
                await fetch(`${SUPABASE_URL}/rest/v1/viajes`, { method: 'POST', headers, body: JSON.stringify({ fecha: nuevaFecha, estado: 'abierto', plazas_disponibles: 4 }) });
                document.getElementById('nuevoDiaInput').value = ''; 
                mostrarToast("📅 Nuevo día añadido.", "exito");
                cargarPanelJefe(); 
            }
        }

        async function cambiarEstadoViaje(viaje_id, nuevoEstado) {
            await fetch(`${SUPABASE_URL}/rest/v1/viajes?id=eq.${viaje_id}`, { method: 'PATCH', headers, body: JSON.stringify({ estado: nuevoEstado }) });
            mostrarToast(`🔄 Estado cambiado a: ${nuevoEstado}`, "exito");
            cargarPanelJefe();
        }

        // ==========================================
        // FUNCIONES DE AMIGOS MULTI-RESERVA Y CANCELACIONES
        // ==========================================
        async function cargarViajesAmigos() {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/viajes?estado=eq.abierto&fecha=gte.${hoyString()}&order=fecha.asc`, { headers, cache: 'no-store' });
            const viajes = await res.json();
            const cal = document.getElementById('calendarioViajes');
            cal.innerHTML = '';
            viajes.forEach(v => {
                const f = new Date(v.fecha.split('T')[0] + 'T12:00:00');
                cal.innerHTML += `
                    <button id="btn_dia_${v.id}" onclick="seleccionarDia('${v.id}')" class="dia-btn flex flex-col items-center justify-center p-3 rounded-2xl border-2 border-slate-200 bg-white hover:border-emerald-500 transition-all shadow-sm">
                        <span class="text-xs font-bold text-slate-400">${f.toLocaleDateString('es-ES', { weekday: 'short' }).toUpperCase()}</span>
                        <span class="text-2xl font-black text-slate-700">${f.getDate()}</span>
                        <span class="text-xs font-bold text-slate-500">${f.toLocaleDateString('es-ES', { month: 'short' }).toUpperCase()}</span>
                    </button>`;
            });
        }

        function seleccionarDia(viaje_id) {
            const index = viajesSeleccionados.indexOf(viaje_id);
            if (index > -1) viajesSeleccionados.splice(index, 1);
            else viajesSeleccionados.push(viaje_id);

            const contador = document.getElementById('contadorDias');
            if (viajesSeleccionados.length > 0) {
                contador.innerText = `${viajesSeleccionados.length} día(s) seleccionados (${viajesSeleccionados.length}€)`;
                contador.classList.remove('hidden');
            } else {
                contador.classList.add('hidden');
            }

            document.querySelectorAll('.dia-btn').forEach(btn => {
                const idBtn = btn.id.replace('btn_dia_', '');
                if (viajesSeleccionados.includes(idBtn)) {
                    btn.className = "dia-btn flex flex-col items-center justify-center p-3 rounded-2xl border-emerald-500 bg-emerald-50 ring-2 ring-emerald-200 transition-all shadow-sm transform scale-105";
                } else {
                    btn.className = "dia-btn flex flex-col items-center justify-center p-3 rounded-2xl border-2 border-slate-200 bg-white hover:border-emerald-500 transition-all shadow-sm";
                }
            });

            if (viajesSeleccionados.length === 0) document.getElementById('mapaCoche').classList.add('hidden');
            else cargarCoche();
        }

        async function cargarCoche() {
            const mapa = document.getElementById('mapaCoche');
            const zonaCancelar = document.getElementById('zonaCancelar');
            if(viajesSeleccionados.length === 0) return;
            mapa.classList.remove('hidden');
            zonaCancelar.classList.add('hidden'); // Ocultar por defecto

            // 1. Reset visual de asientos
            ['copiloto', 'atras_izq', 'atras_cen', 'atras_der'].forEach(id => {
                const btn = document.getElementById(`asiento_${id}`);
                btn.className = `asiento bg-emerald-100 border-2 border-emerald-500 text-emerald-700 p-3 rounded-2xl text-center font-bold text-sm ${id==='copiloto'?'h-24':'h-20'} flex flex-col justify-center items-center cursor-pointer hover:bg-emerald-200 shadow-sm`;
                btn.disabled = false; 
                btn.querySelector('.libre-txt').innerText = "Libre";
            });

            // 2. Traer reservas
            const filter = viajesSeleccionados.join(',');
            const res = await fetch(`${SUPABASE_URL}/rest/v1/reservas?viaje_id=in.(${filter})&select=*`, { headers, cache: 'no-store' });
            const reservasMultiples = await res.json();

            const asientosOcupados = {};
            let tengoReservaEnSeleccion = false;

            reservasMultiples.forEach(r => {
                if(!asientosOcupados[r.asiento]) asientosOcupados[r.asiento] = { nombres: [], soyYo: false };
                const usr = usuariosGlobal.find(u => u.id === r.usuario_id);
                asientosOcupados[r.asiento].nombres.push(usr ? usr.nombre.split(" ")[0] : 'Ocupado');
                if (r.usuario_id === usuarioActual.id) {
                    asientosOcupados[r.asiento].soyYo = true;
                    tengoReservaEnSeleccion = true;
                }
            });

            // 3. Pintar asientos
            ['copiloto', 'atras_izq', 'atras_cen', 'atras_der'].forEach(id => {
                const btn = document.getElementById(`asiento_${id}`);
                const dataAsiento = asientosOcupados[id];

                if (dataAsiento) {
                    if (dataAsiento.soyYo) {
                        btn.className = `bg-blue-100 border-2 border-blue-500 text-blue-700 p-3 rounded-2xl text-center font-bold text-sm ${id==='copiloto'?'h-24':'h-20'} flex flex-col justify-center items-center shadow-sm transform scale-105`;
                        btn.querySelector('.libre-txt').innerText = "Tu sitio";
                        btn.disabled = true;
                    } else {
                        btn.className = `bg-slate-100 border-2 border-slate-300 text-slate-500 p-3 rounded-2xl text-center font-bold text-sm ${id==='copiloto'?'h-24':'h-20'} flex flex-col justify-center items-center opacity-70 cursor-not-allowed`;
                        btn.disabled = true;
                        btn.querySelector('.libre-txt').innerText = viajesSeleccionados.length > 1 ? 'Ocupado algún día' : dataAsiento.nombres[0];
                    }
                } else if (tengoReservaEnSeleccion) {
                    btn.className = `bg-slate-50 border-2 border-slate-200 text-slate-400 p-3 rounded-2xl text-center font-bold text-sm ${id==='copiloto'?'h-24':'h-20'} flex flex-col justify-center items-center cursor-not-allowed opacity-60`;
                    btn.disabled = true;
                    btn.querySelector('.libre-txt').innerText = "Bloqueado";
                }
            });

            // 4. LÓGICA DE CANCELACIÓN (Solo si selecciona 1 solo día y tiene reserva)
            const miReserva = reservasMultiples.find(r => r.usuario_id === usuarioActual.id);
            if (viajesSeleccionados.length === 1 && miReserva) {
                // Buscamos la fecha del viaje en la base de datos
                const resV = await fetch(`${SUPABASE_URL}/rest/v1/viajes?id=eq.${viajesSeleccionados[0]}&select=fecha`, { headers, cache: 'no-store' });
                const dataV = await resV.json();
                
                if (dataV && dataV.length > 0) {
                    // Calculamos matemáticamente las 48h (Suponiendo viaje a las 08:00 AM)
                    const fechaViaje = new Date(dataV[0].fecha.split('T')[0] + 'T08:00:00');
                    const ahora = new Date();
                    const horasFaltantes = (fechaViaje - ahora) / (1000 * 60 * 60);

                    if (horasFaltantes >= 48) {
                        zonaCancelar.innerHTML = `<button onclick="cancelarMiReserva('${viajesSeleccionados[0]}', '${miReserva.id}', '${miReserva.asiento}', '${dataV[0].fecha}')" class="w-full bg-rose-50 text-rose-600 border-2 border-rose-500 hover:bg-rose-100 font-bold py-3 rounded-2xl transition-all shadow-sm active:scale-95 flex items-center justify-center gap-2"><span>❌</span> Cancelar mi reserva (Recuperar 1€)</button>`;
                    } else {
                        zonaCancelar.innerHTML = `<div class="bg-slate-100 text-slate-500 border-2 border-slate-300 font-bold py-3 rounded-2xl text-center shadow-sm text-sm flex flex-col">
                            <span>🔒 Faltan menos de 48h</span>
                            <span class="text-xs font-normal">Ya no se puede cancelar por la web. Avisa a Yisu.</span>
                        </div>`;
                    }
                    zonaCancelar.classList.remove('hidden');
                }
            } else if (viajesSeleccionados.length > 1 && miReserva) {
                mostrarToast("⚠️ Tienes reserva en algún día seleccionado. Para cancelarla, selecciona los días de 1 en 1.", "aviso");
            }
        }

        async function cancelarMiReserva(viajeId, reservaId, asiento, fechaViajeRaw) {
            if(!confirm("¿Seguro que quieres cancelar tu reserva?\nSe te devolverá 1€ pero perderás tu asiento.")) return;
            
            try {
                // 1. Borrar reserva
                await fetch(`${SUPABASE_URL}/rest/v1/reservas?id=eq.${reservaId}`, { method: 'DELETE', headers });
                
                // 2. Devolver 1€
                const nuevoSaldo = usuarioActual.saldo + 1;
                await fetch(`${SUPABASE_URL}/rest/v1/usuarios?id=eq.${usuarioActual.id}`, { method: 'PATCH', headers, body: JSON.stringify({ saldo: nuevoSaldo }) });
                usuarioActual.saldo = nuevoSaldo;
                
                // 3. Añadir a historial
                const fechaLimpia = new Date(fechaViajeRaw.split('T')[0] + 'T12:00:00').toLocaleDateString('es-ES', { day:'numeric', month:'short' });
                await fetch(`${SUPABASE_URL}/rest/v1/movimientos_saldo`, { method: 'POST', headers, body: JSON.stringify({ usuario_id: usuarioActual.id, cantidad: 1, tipo: `Cancelación viaje ${fechaLimpia}` }) });

                // 4. Sumar plaza libre
                const resV = await fetch(`${SUPABASE_URL}/rest/v1/viajes?id=eq.${viajeId}&select=plazas_disponibles`, { headers, cache: 'no-store' });
                const dataV = await resV.json();
                if(dataV && dataV.length > 0) {
                    await fetch(`${SUPABASE_URL}/rest/v1/viajes?id=eq.${viajeId}`, { method: 'PATCH', headers, body: JSON.stringify({ plazas_disponibles: dataV[0].plazas_disponibles + 1 }) });
                }

                mostrarToast("🗑️ Reserva cancelada con éxito. 1€ devuelto.", "exito");
                
                // Recargar el mapa del coche visualmente
                cargarCoche();

                // 5. Avisar a Yisu por WhatsApp
                const nombresAsientos = { 'copiloto': 'Copiloto 🚘', 'atras_izq': 'Atrás Izquierda 👈', 'atras_cen': 'Atrás Medio 🧍', 'atras_der': 'Atrás Derecha 👉' };
                const miNombre = usuarioActual.nombre.split(" ")[0];
                const mensaje = `🚗 ¡Buenas Yisu! Soy ${miNombre}. Al final NO voy a poder ir en el coche el día *${fechaLimpia}* (estaba en ${nombresAsientos[asiento]}). Acabo de cancelar la plaza por la web para dejarla libre. ¡Perdona las molestias!`;

                setTimeout(() => { window.open(`https://api.whatsapp.com/send?phone=34674596477&text=${encodeURIComponent(mensaje)}`, '_blank'); }, 1500);

            } catch(e) { mostrarToast("❌ Error al cancelar reserva.", "error"); }
        }

        async function reservarSitio(asiento) {
            if(viajesSeleccionados.length === 0) return;
            const miNombre = usuarioActual.nombre.split(" ")[0];
            const costeTotal = viajesSeleccionados.length;

            if (usuarioActual.saldo < costeTotal) {
                mostrarToast(`🚫 Necesitas ${costeTotal}€ y tienes ${usuarioActual.saldo}€. Redirigiendo a WhatsApp...`, "error");
                const mensajeRecarga = `🚗 ¡Buenas Yisu! Soy ${miNombre}. Necesito recargar saldo para reservar ${costeTotal} días. 💸`;
                setTimeout(() => { window.open(`https://api.whatsapp.com/send?phone=34674596477&text=${encodeURIComponent(mensajeRecarga)}`, '_blank'); }, 1800);
                return; 
            }

            try {
                for(let vId of viajesSeleccionados) {
                    await fetch(`${SUPABASE_URL}/rest/v1/reservas`, { method: 'POST', headers, body: JSON.stringify({ viaje_id: vId, usuario_id: usuarioActual.id, asiento: asiento, estado: 'confirmada', coste_cobrado: 1 }) });
                    const resViaje = await fetch(`${SUPABASE_URL}/rest/v1/viajes?id=eq.${vId}&select=plazas_disponibles`, { headers, cache: 'no-store' });
                    const dataViaje = await resViaje.json();
                    if(dataViaje && dataViaje.length > 0) {
                        await fetch(`${SUPABASE_URL}/rest/v1/viajes?id=eq.${vId}`, { method: 'PATCH', headers, body: JSON.stringify({ plazas_disponibles: dataViaje[0].plazas_disponibles - 1 }) });
                    }
                }

                const saldoOriginal = usuarioActual.saldo;
                const nuevoSaldo = saldoOriginal - costeTotal;
                await fetch(`${SUPABASE_URL}/rest/v1/usuarios?id=eq.${usuarioActual.id}`, { method: 'PATCH', headers, body: JSON.stringify({ saldo: nuevoSaldo }) });
                usuarioActual.saldo = nuevoSaldo; 

                await fetch(`${SUPABASE_URL}/rest/v1/movimientos_saldo`, { method: 'POST', headers, body: JSON.stringify({ usuario_id: usuarioActual.id, cantidad: -costeTotal, tipo: `Reserva de ${costeTotal} día(s)` }) });

                mostrarToast(`🚗 ¡${costeTotal} asiento(s) reservado(s) con éxito!`, "exito");
                
                viajesSeleccionados = [];
                document.getElementById('contadorDias').classList.add('hidden');
                document.querySelectorAll('.dia-btn').forEach(btn => btn.className = "dia-btn flex flex-col items-center justify-center p-3 rounded-2xl border-2 border-slate-200 bg-white hover:border-emerald-500 transition-all shadow-sm");
                document.getElementById('mapaCoche').classList.add('hidden');

                const nombresAsientos = { 'copiloto': 'Copiloto 🚘', 'atras_izq': 'Atrás Izquierda 👈', 'atras_cen': 'Atrás Medio 🧍', 'atras_der': 'Atrás Derecha 👉' };
                const mensaje = `🚗 ¡Buenas! Soy ${miNombre}. Acabo de pillarme el asiento de *${nombresAsientos[asiento]}* para *${costeTotal} días* distintos. ¡Nos vemos!`;
                
                if (nuevoSaldo === 0) setTimeout(() => mostrarToast("⚠️ Te has quedado a 0€. ¡Recarga pronto!", "aviso"), 800);
                setTimeout(() => { window.open(`https://api.whatsapp.com/send?phone=34674596477&text=${encodeURIComponent(mensaje)}`, '_blank'); }, 1800);
            } catch(e) { mostrarToast("📡 Error de red al procesar las reservas.", "error"); }
        }

        init();
    </script>
</body>
</html>
