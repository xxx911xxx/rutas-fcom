<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coche FCom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .asiento { transition: all 0.2s; }
        .asiento:active { transform: scale(0.95); }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 font-sans text-slate-800">

    <!-- PANTALLA 1: LOGIN -->
    <div id="pantallaLogin" class="max-w-md mx-auto bg-white rounded-3xl shadow-xl p-8 mt-10">
        <h1 class="text-3xl font-bold text-center mb-8">🚗 Login FCom</h1>
        <select id="selectorUsuario" class="w-full border-2 border-slate-200 rounded-xl p-4 text-lg mb-4 outline-none font-medium">
            <option value="">Cargando usuarios...</option>
        </select>
        <input type="password" id="pinSecreto" maxlength="4" placeholder="Tu PIN (4 cifras)" class="w-full border-2 border-slate-200 rounded-xl p-4 text-center text-2xl tracking-[1em] mb-6 outline-none font-bold">
        <button onclick="iniciarSesion()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg text-lg">Entrar</button>
        <p id="errorLogin" class="text-rose-500 text-center font-bold mt-4 hidden">PIN incorrecto</p>
    </div>

    <!-- PANTALLA 2: MODO JEFE (ADMIN) -->
    <div id="pantallaAdmin" class="max-w-md mx-auto bg-white rounded-3xl shadow-xl p-8 mt-10 hidden">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-blue-600">👑 Panel Jefe</h1>
            <button onclick="cerrarSesion()" class="text-slate-500 underline">Salir</button>
        </div>
        <h2 class="font-bold mb-4">Días creados en la Base de Datos:</h2>
        <div id="listaViajesAdmin" class="space-y-4"></div>
    </div>

    <!-- PANTALLA 3: MODO AMIGOS (RESERVAS Y COCHE) -->
    <div id="pantallaAmigos" class="max-w-md mx-auto bg-white rounded-3xl shadow-xl p-6 mt-10 hidden">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-emerald-600">🚗 Elige tu sitio</h1>
            <button onclick="cerrarSesion()" class="text-slate-500 underline">Salir</button>
        </div>
        
        <label class="font-bold text-slate-700 mb-2 block">1. Selecciona el día:</label>
        <select id="selectorViaje" class="w-full border-2 border-slate-200 rounded-xl p-3 mb-6 outline-none" onchange="cargarCoche()">
            <option value="">Elige un día abierto...</option>
        </select>

        <!-- MAPA DEL COCHE -->
        <div id="mapaCoche" class="hidden bg-slate-50 rounded-3xl p-6 border-4 border-slate-200 relative">
            <div class="text-center font-bold text-slate-400 mb-4">PARTE DELANTERA</div>
            
            <div class="grid grid-cols-2 gap-6 mb-6">
                <!-- Conductor (Tú) -->
                <div class="bg-slate-800 text-white p-4 rounded-2xl text-center font-bold flex flex-col justify-center opacity-80 cursor-not-allowed h-24">
                    <span>Volante 🚘</span>
                    <span class="text-xs font-normal">Yisu (Tú)</span>
                </div>
                <!-- Copiloto -->
                <button id="asiento_copiloto" onclick="reservarSitio('copiloto')" class="asiento bg-emerald-100 border-2 border-emerald-500 text-emerald-700 p-4 rounded-2xl text-center font-bold h-24">
                    <span>Copiloto</span>
                    <span class="block text-xs font-normal mt-1 libre-txt">Libre</span>
                </button>
            </div>

            <div class="grid grid-cols-3 gap-2">
                <!-- Atrás Izquierda -->
                <button id="asiento_atras_izq" onclick="reservarSitio('atras_izq')" class="asiento bg-emerald-100 border-2 border-emerald-500 text-emerald-700 p-3 rounded-2xl text-center font-bold text-sm h-20 flex flex-col justify-center items-center">
                    <span>Izq.</span>
                    <span class="block text-xs font-normal libre-txt">Libre</span>
                </button>
                <!-- Atrás Centro -->
                <button id="asiento_atras_cen" onclick="reservarSitio('atras_cen')" class="asiento bg-emerald-100 border-2 border-emerald-500 text-emerald-700 p-3 rounded-2xl text-center font-bold text-sm h-20 flex flex-col justify-center items-center">
                    <span>Medio</span>
                    <span class="block text-xs font-normal libre-txt">Libre</span>
                </button>
                <!-- Atrás Derecha -->
                <button id="asiento_atras_der" onclick="reservarSitio('atras_der')" class="asiento bg-emerald-100 border-2 border-emerald-500 text-emerald-700 p-3 rounded-2xl text-center font-bold text-sm h-20 flex flex-col justify-center items-center">
                    <span>Der.</span>
                    <span class="block text-xs font-normal libre-txt">Libre</span>
                </button>
            </div>
        </div>
        <p id="mensajeReserva" class="text-center mt-4 font-bold text-emerald-600 hidden">¡Asiento reservado con éxito!</p>
    </div>

    <script>
        // ======= CONFIGURACIÓN SUPABASE =======
        const SUPABASE_URL = "https://wangfcwblatimxldtvva.supabase.co";
        const SUPABASE_KEY = "sb_publishable_pA_FcTBC-G4c2dJiFydsuw_c45SIiAA"; // ⚠️ PON TU PUBLISHABLE KEY AQUÍ
        
        const headers = {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
        };

        let usuarioActual = null;
        let usuariosGlobal = [];

        // 1. ARRANCAR WEB
        async function init() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/usuarios?select=*`, { headers });
                usuariosGlobal = await res.json();
                const sel = document.getElementById('selectorUsuario');
                sel.innerHTML = '<option value="">¿Quién eres?</option>';
                usuariosGlobal.forEach(u => sel.innerHTML += `<option value="${u.id}">${u.nombre}</option>`);
            } catch (e) { alert("Error cargando usuarios"); }
        }

        // 2. SISTEMA DE LOGIN
        async function iniciarSesion() {
            const id = document.getElementById('selectorUsuario').value;
            const pin = document.getElementById('pinSecreto').value;
            if(!id || !pin) return;

            const res = await fetch(`${SUPABASE_URL}/rest/v1/usuarios?id=eq.${id}&pin=eq.${pin}&select=*`, { headers });
            const data = await res.json();

            if (data.length === 0) {
                document.getElementById('errorLogin').classList.remove('hidden');
            } else {
                usuarioActual = data[0];
                document.getElementById('pantallaLogin').classList.add('hidden');
                
                if (usuarioActual.es_admin) {
                    document.getElementById('pantallaAdmin').classList.remove('hidden');
                    cargarPanelJefe();
                } else {
                    document.getElementById('pantallaAmigos').classList.remove('hidden');
                    cargarViajesAmigos();
                }
            }
        }

        function cerrarSesion() {
            location.reload(); // Recarga la página entera para salir
        }

        // 3. FUNCIONES MODO JEFE
        async function cargarPanelJefe() {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/viajes?order=fecha.asc`, { headers });
            const viajes = await res.json();
            const lista = document.getElementById('listaViajesAdmin');
            lista.innerHTML = '';

            viajes.forEach(v => {
                const fechaLimpia = new Date(v.fecha).toLocaleDateString('es-ES');
                const esAbierto = v.estado === 'abierto';
                const colorBtn = esAbierto ? 'bg-rose-500' : 'bg-emerald-500';
                const textoBtn = esAbierto ? 'Cerrar Viaje' : 'Abrir Viaje';
                const nuevoEstado = esAbierto ? 'cerrado' : 'abierto';

                lista.innerHTML += `
                    <div class="p-4 border-2 border-slate-100 rounded-xl flex justify-between items-center shadow-sm">
                        <div>
                            <p class="font-bold">${fechaLimpia}</p>
                            <p class="text-sm text-slate-500">Estado: ${v.estado.toUpperCase()}</p>
                        </div>
                        <button onclick="cambiarEstadoViaje('${v.id}', '${nuevoEstado}')" class="${colorBtn} text-white px-4 py-2 rounded-lg font-bold text-sm">
                            ${textoBtn}
                        </button>
                    </div>`;
            });
        }

        async function cambiarEstadoViaje(viaje_id, nuevoEstado) {
            await fetch(`${SUPABASE_URL}/rest/v1/viajes?id=eq.${viaje_id}`, {
                method: 'PATCH',
                headers: headers,
                body: JSON.stringify({ estado: nuevoEstado })
            });
            cargarPanelJefe(); // Recargar la lista visual
        }

        // 4. FUNCIONES MODO AMIGOS (EL COCHE)
        async function cargarViajesAmigos() {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/viajes?estado=eq.abierto&order=fecha.asc`, { headers });
            const viajes = await res.json();
            const sel = document.getElementById('selectorViaje');
            sel.innerHTML = '<option value="">Selecciona una fecha...</option>';
            viajes.forEach(v => {
                sel.innerHTML += `<option value="${v.id}">${new Date(v.fecha).toLocaleDateString('es-ES')}</option>`;
            });
        }

        async function cargarCoche() {
            const viaje_id = document.getElementById('selectorViaje').value;
            const mapa = document.getElementById('mapaCoche');
            
            if(!viaje_id) {
                mapa.classList.add('hidden');
                return;
            }
            mapa.classList.remove('hidden');

            // Resetear todos los asientos a libre (Verde)
            const asientosHTML = ['copiloto', 'atras_izq', 'atras_cen', 'atras_der'];
            asientosHTML.forEach(id => {
                const btn = document.getElementById(`asiento_${id}`);
                btn.className = "asiento bg-emerald-100 border-2 border-emerald-500 text-emerald-700 p-3 rounded-2xl text-center font-bold text-sm h-20 flex flex-col justify-center items-center";
                if(id === 'copiloto') btn.classList.replace('h-20', 'h-24');
                btn.disabled = false;
                btn.querySelector('.libre-txt').innerText = "Libre";
            });

            // Buscar quién ha reservado ya
            const res = await fetch(`${SUPABASE_URL}/rest/v1/reservas?viaje_id=eq.${viaje_id}`, { headers });
            const reservas = await res.json();

            reservas.forEach(r => {
                const btn = document.getElementById(`asiento_${r.asiento}`);
                if(btn) {
                    const nombreUsuario = usuariosGlobal.find(u => u.id === r.usuario_id)?.nombre || 'Ocupado';
                    // Poner el botón rojo y bloquearlo
                    btn.className = "bg-rose-100 border-2 border-rose-500 text-rose-700 p-3 rounded-2xl text-center font-bold text-sm h-20 flex flex-col justify-center items-center opacity-70 cursor-not-allowed";
                    if(r.asiento === 'copiloto') btn.classList.replace('h-20', 'h-24');
                    btn.disabled = true;
                    btn.querySelector('.libre-txt').innerText = nombreUsuario.split(" ")[0]; // Solo el primer nombre
                }
            });
        }

        async function reservarSitio(asiento) {
            const viaje_id = document.getElementById('selectorViaje').value;
            if(!viaje_id) return;

            try {
                // 1. Guardar la reserva
                await fetch(`${SUPABASE_URL}/rest/v1/reservas`, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ viaje_id: viaje_id, usuario_id: usuarioActual.id, asiento: asiento })
                });

                // 2. Mostrar éxito y recargar el mapa visual
                const msg = document.getElementById('mensajeReserva');
                msg.classList.remove('hidden');
                setTimeout(() => msg.classList.add('hidden'), 3000);
                cargarCoche(); 
                
            } catch(e) { alert("Hubo un error al reservar el sitio."); }
        }

        init();
    </script>
</body>
</html>
